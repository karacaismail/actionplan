# CI + GitHub Pages dağıtımı.
#  - main'e PUSH: build (tüm kapılar) + deploy.
#  - main'e PR: yalnız build (kapılar doğrulanır) — deploy YOK. PR'ın "build" check'i merge için zorunludur.
# Gateler BLOKLAYICI: tip/lint/WBS/içerik/ruleset/surface/audit/veri-kalite/birim/E2E herhangi biri kırmızıysa merge ve deploy engellenir.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu çek
        uses: actions/checkout@v4

      - name: Node 20 kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bağımlılıkları kur
        run: npm install --no-audit --no-fund

      - name: Tip denetimi
        run: npm run typecheck

      # Lint kapısı (biome — BLOKLAYICI). Kod stili + statik a11y kuralları (JSX) + import düzeni.
      # CI ubuntu-x64'te npm install doğru biome ikilisini (cli-linux-x64) çözer.
      - name: Lint (biome)
        run: npm run lint

      # App kimliği kapısı (BLOKLAYICI). Katalog karar registry'si bütün generated node
      # snapshot'ını kapsar; canonical app/legacy alias/portfolio/foundation ayrımı kabul
      # edilmiş kimlik kararlarıyla aynı kalır.
      - name: App kimliği kapısı (registry + canonical alias)
        run: npm run qa:app-identity

      # Enterprise app/module sözleşme kapıları (BLOKLAYICI). Materyalizasyon byte-drift'i,
      # typed app tanımı, SDK-only app-core/module grafı ve planlanan/gerçek kanıt ayrımı
      # genel kapılardan ve build'den önce fail-closed doğrulanır.
      - name: App sözleşme kapıları (drift + contract + graph + evidence)
        run: npm run qa:app-contracts

      # Kernel WBS entegrasyon kapısı (BLOKLAYICI). Görseldeki 12.1-12.14 alanlarını
      # 617 görevin tamamında root/provider/SDK/consumer/contributor/N-A kararıyla,
      # app manifesti ve module public-port parity'siyle birlikte doğrular.
      - name: Kernel WBS entegrasyon kapısı (617 görev + public SDK sınırı)
        run: npm run qa:kernel-integrations

      # Kernel plan bütünlüğü kapısı (BLOKLAYICI). Boş development/done kümesini readiness
      # saymaz; canlı graph/queue/ADR/WBS blocker'ları varken runtime kararı NO-GO kalır.
      - name: Kernel governance kapısı (non-vacuous NO-GO)
        run: npm run qa:kernel-governance

      # Platform ürün-kodu yazma sınırı (BLOKLAYICI). Actionplan yalnız directive/handoff
      # üretir; AI aktörlerinin platform implementation dosyalarına yazma yetkisi yoktur.
      - name: Platform yazma sınırı kapısı (AI read-only)
        run: npm run qa:platform-write-boundary

      # Eski platform generator'ları kanonik JSON'a koşulsuz yazamaz. Seed karantinasından
      # ayrı olan bu kapı, üç legacy writer'ın doğrudan çalıştırılmasını fail-closed bloklar.
      - name: Legacy platform writer karantinası
        run: npm run qa:legacy-platform-writers

      # WBS doğa metaforu kapısı (BLOKLAYICI). app=ada, module=dağ, archetype=kaya,
      # feature=taş, component=kum, work_unit=molekül, micro_step=atom eşlemesini
      # şema/UI/generated data/doküman/CI yüzeyinde tek sözleşme olarak zorlar.
      - name: WBS doğa metaforu kapısı
        run: npm run qa:wbs

      # Docs -> WBS task-content materializasyon kapısı (BLOKLAYICI). Rule registry, belge-bazlı
      # kaynak kapsamı, canonical/public parity ve matrix byte-drift birlikte doğrulanır.
      - name: Doküman → görev içeriği materyalizasyon kapısı
        run: npm run qa:doc-content

      # İçerik kalite kapısı (Faz F2 — BLOKLAYICI). Önce bağımlılıksız node checker (hızlı, rollup gerekmez),
      # sonra kanonik vitest testi. 485 düğümün hiçbiri şablona (kalıp imzası/çapraz-tekrar) geri dönerse deploy durur.
      - name: İçerik kalite kapısı (node checker + vitest)
        run: npm run qa:content

      # ECA ruleset paket kataloğu kapısı (Küme C — BLOKLAYICI). Katalog şema/güvenlik kurallarını
      # (system katmanı AI-değiştirilemez, maxChainDepth ≤6, layer/category geçerli) zorlar.
      - name: ECA ruleset kataloğu kapısı
        run: node tools/agents/check-ruleset.mjs

      # Surface/Workflow sözleşme kataloğu kapısı (Küme D — BLOKLAYICI). Durum makinesi tutarlılığı
      # (initial/terminal/transition states) + Workflow→ECA paketi çapraz-referans bütünlüğünü zorlar.
      - name: Surface/Workflow kataloğu kapısı
        run: node tools/agents/check-surface.mjs

      # Tech-profile kapısı (ADR-0026 — BLOKLAYICI). Frontend stack manifesti headless KİLİT (her
      # profil headless), stillenmiş kit + framework global yasağı (antd/MUI/Chakra/Mantine/Flowbite/
      # Next/Redux), package.json + kaynak import taraması, surface techProfileRef referans bütünlüğü.
      - name: Tech-profile kapısı (headless kilit + yasak-lib + techProfileRef)
        run: node tools/agents/check-tech-profile.mjs

      # Mühendislik standardı işletim kapıları (ADR-0027 — hepsi BLOKLAYICI). standardRefs referans
      # bütünlüğü, boyut N/A gerekçesi, waiver yaşam döngüsü, kısa-kod tavanı, bağımlılık politikası,
      # UI standartları (emoji/styled-kit yok). Standartlar tavsiye değil, kapı.
      - name: Standart applicability projeksiyon drift kapısı
        run: node tools/apply-standard-applicability.mjs

      - name: Standart kapsamı kapısı (standardRefs referans bütünlüğü)
        run: node tools/agents/check-standards-coverage.mjs

      - name: Boyut uygulanabilirliği kapısı (applies=false ⇒ gerekçe)
        run: node tools/agents/check-dimension-applicability.mjs

      # Boyut semantiği + weak-content ratchet kapısı (BLOKLAYICI). Dolu dataLifecycle/
      # observability/reliability kartında must+anyOf kavram sözleşmesi: retention+PII,
      # SLO+metrik, failure-mode+idempotency zorunlu. Biçim (2-5 madde) yetmez; anlam aranır.
      # empty-but-not-na / generic / short-items artamaz; konsol özeti rapordur.
      - name: Boyut semantiği + weak-content ratchet kapısı
        run: npm run qa:dimensions
      - name: Waiver yaşam döngüsü kapısı (gerekçe + onay + süre)
        run: node tools/agents/check-waivers.mjs

      - name: Kısa-kod kapısı (dosya satır tavanı)
        run: node tools/agents/check-short-code.mjs

      - name: Bağımlılık politikası kapısı (yasak paket + güvensiz sürüm)
        run: node tools/agents/check-dependency-policy.mjs

      - name: UI standartları kapısı (emoji/styled-kit yok)
        run: node tools/agents/check-ui-standards.mjs

      # UI delivery kapısı (Storybook + Master Component entegrasyonu — BLOKLAYICI).
      # UI-impact adayı düğümler makine-okunur uiDelivery sözleşmesi taşır; backend-only
      # düğümler zorlanmaz (NO_CANDIDATES). Ratchet: legacy ihlaller baseline'da warning.
      - name: UI delivery kapısı (uiDelivery sözleşmesi + ratchet)
        run: npm run qa:ui-delivery

      # URL policy kapısı (kanonik karar koruması — BLOKLAYICI)
      # docs/url-policy.md tek kanonik otoritedir; eski tilde grameri, eski route-identity adı,
      # merkezi resource-identity tablosu ve node-id kanonik route önerileri docs katmanına geri
      # sızamaz; sekiz kanonik karar belgede kalır. Muafiyet: url-policy.md (reddiye) + node.md.
      - name: URL policy kapısı (yasak desen taraması + kanonik karar varlığı)
        run: npm run qa:url-policy

      # Global pazar hazırlığı sözleşme kapısı (JSON-STD J2 — BLOKLAYICI). global-market-readiness.json
      # (14 soruluk launch kapısı, IP-geolocation sınırı, kill switch, ödeme matrisi, destek dili
      # taahhüdü, locale-bazlı moderasyon) + indeks/matris kayıtları + anlatı çapası birlikte korunur.
      - name: Market-readiness kapısı (sözleşme + indeks + çapa)
        run: npm run qa:market-readiness

      # Finansal para modeli sözleşme kapısı (JSON-STD J2 — BLOKLAYICI). finance-money-model.json
      # (decimal + ISO 4217 + açık ölçek, minor-unit varsayımı yasağı, üç para-birimi ayrımı,
      # kur tarihi beyanı, yuvarlama politikası, altı finansal durum) + indeks/matris + çapa.
      - name: Finans para-modeli kapısı (sözleşme + indeks + çapa)
        run: npm run qa:finance-model

      # Storybook registry kapısı (kök-entegrasyon — BLOKLAYICI): src/data/storybook/
      # 16 kanonik registry ailesinin şema geçerliliği + FK/duplicate/orphan denetimi.
      - name: Storybook registry kapısı (FK + duplicate + şema)
        run: npm run qa:storybook-registry

      # i18n/l10n kapısı (ADR-0027 / 15. standart — BLOKLAYICI). i18n-standards.json sözleşmesi
      # (yedi must kuralı + banned/allowed primitifleri), i18nRef referans bütünlüğü ("i18n-standards"),
      # i18n-text alanlarının locale beyanı + çeviri anahtarı formatı. Surface i18n alanı uyarı (ratchet).
      - name: i18n kapısı (locale beyanı + i18nRef bütünlüğü + çeviri anahtarı)
        run: node tools/agents/check-i18n.mjs

      # Kernel sözleşme paketi kapısı (core-contract-pack §2 — BLOKLAYICI). Beş zorunlu primitifin
      # (tenant/authz/audit/observability/module-sdk) sözleşme-referansı: §2.x başlık çıpası + arayüz
      # imzası (backend paket yolu) + API referansı. "Adı geçiyor ama tanımlı değil" driftini bloklar.
      - name: Kernel sözleşme kapısı (core-contract §2 primitif referansları)
        run: node tools/agents/check-core-contract.mjs

      # Teslim sırası kapısı (BLOKLAYICI). Kernel -> SDK -> app-core -> app module'leri -> app
      # assembly hattının kanonik doküman, workspace manifest, export prompt ve CI zincirinde
      # aynı kalmasını zorlar. App doğrudan kod yazma yeri değildir.
      - name: Teslim sırası kapısı (kernel -> SDK -> app-core -> app module -> app)
        run: npm run qa:delivery-sequence

      # Denetim/kalite kapısı (audit golden + köken iddiası — BLOKLAYICI). Golden düğümler
      # (product/customer/s-crm) ≥2.3 ve 17 üretim boyutu dolu kalmalı; "human/swarm" köken iddialı
      # düğümler eşik (2.0) altına düşemez. Skorlama uygulama-içi denetim görünümüyle ortak.
      - name: Kalite kapısı (audit — golden + köken)
        run: npm run qa:lint

      # Veri kalite kapısı (Faz P3 — BLOKLAYICI). owner %100 dolu + geçerli ekip (people.json),
      # dependsOn/blocks/related referans bütünlüğü (dangling yok), dependsOn grafiği DAG (döngü yok).
      - name: Veri kalite kapısı (owner + referans bütünlüğü + DAG)
        run: npm run qa:data

      # Yürütme hazırlığı kapısı (Faz P5+ — BLOKLAYICI). done=kanıtlı (evidence+verification),
      # dev+ fazdaki düğüm yürütülebilir (owner+refs+schedule+AC), platform izlenebilir (traceability).
      - name: Yürütme hazırlığı kapısı (done-evidence + execution-readiness + platform-traceability)
        run: npm run qa:exec

      # Definition of Ready kapısı (DX — BLOKLAYICI). development fazındaki düğüm repoPath+testCommand+implementationStatus taşımalı.
      - name: Definition of Ready kapısı (ready-for-dev)
        run: npm run qa:ready

      # Vibecoding/vobecoding handoff kapısı (BLOKLAYICI). Task Detail exportları,
      # implementation workspace manifesti, yasak stack, Agent Prompt, Developer Brief,
      # Evidence Patch ve kısa görev kartı birlikte drift etmeden kalmalı.
      - name: Vibecoding handoff kapısı (export + workspace + docs)
        run: npm run qa:vibecoding

      # Waterfall handoff kapısı (BLOKLAYICI). Bu repo ürün kodu değil; enterprise-grade
      # yol haritası ve geliştirici iş tanımı deposudur. Bu kapı tüm düğümlerin owner,
      # schedule, phase criteria, deliverable, AC, risk, rollback, refs ve 17 boyut ile
      # geliştiriciye devredilebilir plan tanımı taşımasını zorlar; evidence/repoPath ise
      # yalnız gerçek development/done fazlarında ayrı kapılarla zorlanır.
      - name: Waterfall handoff kapısı (plan tanımı)
        run: npm run qa:waterfall

      # Scale-invariant kapısı (ADR-K3 / SCV — BLOKLAYICI). Para/sipariş/stok yazan (financial|order|
      # inventory etiketli) mutasyon sözleşmesi outbox+idempotency zarfını beyan etmeden merge edilemez;
      # koruma zarfı sözleşme düğümleri mevcut olmalı. Plan katmanında beyan-tabanlı (kod-seviyesi platform repo).
      - name: Scale-invariant kapısı (etiketli mutasyon → outbox+idempotency beyanı)
        run: node tools/agents/check-scale-invariant.mjs

      # Atomik tip + Fragment + execution-contract yapı bütünlüğü kapıları (BLOKLAYICI).
      # qa:atom readiness, schema/registry ve value-atom test paketinin tamamını çalıştırır.
      - name: Atomik tip katmanı kapısı (readiness + registry + şema + düğüm referansı)
        run: npm run qa:atom

      - name: Fragment kademesi kapısı (FragmentSchema canonical/storage/crossFieldRules + yönerge)
        run: node tools/agents/check-fragments.mjs

      - name: Execution-contract kapısı (7 yönerge + ADR-A5 storage kilidi)
        run: node tools/agents/check-execution-contract.mjs

      # Aktivasyon kapıları (gap-2026-07-02 — yanlış-güveni kapatır). Dokümanlar bu kapıları
      # "CI'da çalışıyor" diye anlatıyordu ama dosyaları yoktu; şimdi gerçekten çalışıyorlar.
      # event-semantics + state-machine + event, sert-fail yalnız imkansız/yasak durumda; eksik
      # beyan WARN (ratchet). archetype-relation geçersiz kind'da sert-fail, sarkan hedef WARN.
      - name: Akış/semantik tutarlılık kapıları
        run: npm run qa:flow

      # Sır sızıntısı kapısı (gitleaks yerine hafif desen-tabanlı — repo checklist P0'ını kapatır).
      - name: Sır sızıntısı kapısı (PAT/anahtar deseni)
        run: node tools/agents/check-secrets.mjs

      - name: Birim testleri
        run: npm test

      # E2E + erişilebilirlik (axe WCAG 2.2). Dev-server tabanlı (build gerekmez).
      - name: E2E + axe
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e

      - name: Üretim derlemesi
        env:
          BASE_PATH: /actionplan/
        run: npm run build

      # Pages artefakt kapısı (BLOKLAYICI). Production build'in /actionplan/ base-path'ini,
      # app/app-core/legacy-alias derin URL index'lerini ve public nodes JSON içindeki typed
      # enterprise + SDK-only sözleşmelerini upload/deploy öncesinde fail-closed doğrular.
      - name: Pages app sözleşmesi smoke (base + deep routes + public JSON)
        run: npm run qa:pages-app-smoke

      # Pages adımları yalnız main ref'inde gerçek dağıtımda çalışır; PR ve feature-ref
      # workflow_dispatch kapıları doğrular ama artefakt yüklemez veya deploy ETMEZ.
      - name: Pages yapılandırması
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Pages artefaktını yükle
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pages'e dağıt
        id: deployment
        uses: actions/deploy-pages@v4
